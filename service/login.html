<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}} · 业达投资</title><link href="/screen.css" rel="stylesheet"><div class="loginbox panel"><h2>业达投资 · 股权管理系统</h2><h3>{{TITLE}}</h3><form id="login"><label>用户名<input name="name" required autocomplete="username"></label><label>密码<input name="password" required type="password" autocomplete="current-password"></label><button class="primary">{{TITLE}}</button><p role="status"></p></form></div><script>
login.onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector('button');b.disabled=true;try{const res=await fetch('/api/{{ACTION}}',{method:'POST',headers:{'Content-Type':'application/json','X-Workspace':'1'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});if(res.ok)location.reload();else f.querySelector('p').textContent=(await res.json()).error}catch{f.querySelector('p').textContent='无法连接团队服务'}finally{b.disabled=false}}
</script></html>
